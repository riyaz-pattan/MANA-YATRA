name: mana_yatra_rider
description: "Mana Yatra Rider App - Zero commission rides, fair prices"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  firebase_database: ^11.3.5
  firebase_storage: ^12.4.5
  provider: ^6.1.2
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  flutter_dotenv: ^5.2.1

  geolocator: ^13.0.2
  http: ^1.3.0
  pin_code_fields: ^8.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  firebase_messaging: ^15.2.10
  cloud_functions: ^5.3.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/ashvo_logo.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/logo/ashvo_splash.png"
  android: true
  ios: true
  fullscreen: true
  android_12:
    image: "assets/images/logo/ashvo_splash.png"
    color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/map_icons/auto.png
    - assets/images/map_icons/bike.png
    - assets/images/landing_illustration.png
