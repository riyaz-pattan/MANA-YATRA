name: Ashwa
description: "Ashwa App - Zero commission rides, fair prices"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  firebase_database: ^11.3.5
  firebase_storage: ^12.4.5
  provider: ^6.1.2
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  flutter_dotenv: ^5.2.1

  geolocator: ^13.0.2
  http: ^1.3.0
  pinput: ^5.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  firebase_messaging: ^15.2.10
  cloud_functions: ^5.6.2
  uuid: ^4.5.3
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  workmanager: ^0.9.0
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  confetti: ^0.8.0
  flutter_native_splash: ^2.4.0
  firebase_performance: ^0.10.1+10
  firebase_app_check: ^0.3.2+10
  upgrader: ^13.3.0
  smart_auth: ^3.2.0
  dart_geohash: ^2.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.5
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/ashvo_logo.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/logo/ashvo_splash.png"
  android: true
  ios: true
  fullscreen: true
  android_12:
    image: "assets/images/logo/ashvo_splash.png"
    color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/map_icons/auto.png
    - assets/images/map_icons/bike.png
    - assets/images/landing_illustration.png
