name: mana_yatra_driver
description: "Mana Yatra Driver App - Earn fairly, drive freely"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  firebase_database: ^11.3.5
  firebase_storage: ^12.4.5
  provider: ^6.1.2
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  flutter_dotenv: ^5.2.1

  geolocator: ^13.0.2
  http: ^1.3.0
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  image: ^4.5.3
  intl: ^0.20.2
  dart_geohash: ^2.1.0
  url_launcher: ^6.3.2
  fluttertoast: ^9.0.0
  permission_handler: ^12.0.1
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/map_icons/auto.png
    - assets/images/map_icons/bike.png
